<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的个人网页</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="nav">
        <div class="logo">MySite</div>
        <ul>
          <li><a href="#about">关于我</a></li>
          <li><a href="#projects">项目</a></li>
          <li><a href="#contact">联系</a></li>
        </ul>
      </nav>
      <div class="hero-content">
        <h1>你好，我是你的名字</h1>
        <p>我是一名热爱创造的开发者 / 设计师 / 创作者。</p>
        <a class="btn" href="#projects">查看我的作品</a>
      </div>
    </header>

    <main>
      <section id="about" class="section">
        <h2>关于我</h2>
        <p>
          这里写一段简短的个人介绍：你做什么、擅长什么、以及你希望通过这个网页传达什么。
        </p>
      </section>

      <section id="projects" class="section">
        <h2>项目展示</h2>
        <div class="cards">
          <article class="card">
            <h3>项目一</h3>
            <p>一句话描述项目亮点。</p>
          </article>
          <article class="card">
            <h3>项目二</h3>
            <p>一句话描述项目亮点。</p>
          </article>
          <article class="card">
            <h3>项目三</h3>
            <p>一句话描述项目亮点。</p>
          </article>
        </div>
      </section>

      <section id="contact" class="section">
        <h2>联系我</h2>
        <p>邮箱：your.email@example.com</p>
        <p>GitHub：github.com/yourname</p>
      </section>
    </main>

    <footer>
      <p>© <span id="year"></span> 你的名字. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
